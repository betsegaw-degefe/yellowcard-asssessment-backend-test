AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Yellow Card Backend Test - Transaction Service (SAM + LocalStack)

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 10
    MemorySize: 256
    Environment:
      Variables:
        TABLE_NAME: !Ref TransactionsTable
        AWS_NODEJS_CONNECTION_REUSE_ENABLED: "1"

Resources:
  Api:
    Type: AWS::Serverless::Api
    Properties:
      StageName: local
      EndpointConfiguration: REGIONAL
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type'"
        AllowOrigin: "'*'"

  TransactionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: transactions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      StreamSpecification:
        StreamViewType: NEW_IMAGE


  HealthCheckFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - src/healthCheck.ts
    Properties:
      Handler: healthCheck.handler
      Events:
        Health:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /health
            Method: GET

  CreateTransactionFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - src/createTransaction.ts
    Properties:
      Handler: createTransaction.handler
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource: !GetAtt TransactionsTable.Arn
      Events:
        CreateTransaction:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /transactions
            Method: POST

  GetTransactionFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - src/getTransaction.ts
    Properties:
      Handler: getTransaction.handler
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource: !GetAtt TransactionsTable.Arn
      Events:
        GetTransaction:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /transactions/{id}
            Method: GET

  # SNS Topic for DynamoDB Stream events
  TransactionDBUpdatesTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: TRANSACTION-DB-UPDATES-TOPIC

  # SQS Queue for PENDING transactions
  TransactionPendingEventsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: TransactionPendingEventsQueue
      VisibilityTimeout: 30

  # SQS Queue for PROCESSING transactions
  TransactionProcessingEventsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: TransactionProcessingEventsQueue
      VisibilityTimeout: 30

  # SQS Queue Policy for SNS to send messages
  TransactionPendingEventsQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref TransactionPendingEventsQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt TransactionPendingEventsQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Ref TransactionDBUpdatesTopic

  TransactionProcessingEventsQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref TransactionProcessingEventsQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt TransactionProcessingEventsQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Ref TransactionDBUpdatesTopic

  # SNS Subscription for PENDING status
  TransactionPendingEventsSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref TransactionDBUpdatesTopic
      Protocol: sqs
      Endpoint: !GetAtt TransactionPendingEventsQueue.Arn
      FilterPolicy:
        status:
          - "PENDING"
      RawMessageDelivery: true

  # SNS Subscription for PROCESSING status
  TransactionProcessingEventsSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref TransactionDBUpdatesTopic
      Protocol: sqs
      Endpoint: !GetAtt TransactionProcessingEventsQueue.Arn
      FilterPolicy:
        status:
          - "PROCESSING"
      RawMessageDelivery: true

  # StreamPublisher Lambda: DynamoDB Stream -> SNS Topic
  StreamPublisherFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - src/streamPublisher.ts
    Properties:
      Handler: streamPublisher.handler
      Environment:
        Variables:
          SNS_TOPIC_ARN: !Ref TransactionDBUpdatesTopic
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetRecords
                - dynamodb:GetShardIterator
                - dynamodb:DescribeStream
                - dynamodb:ListStreams
              Resource: !GetAtt TransactionsTable.StreamArn
            - Effect: Allow
              Action:
                - sns:Publish
              Resource: !Ref TransactionDBUpdatesTopic
      Events:
        DynamoDBStream:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt TransactionsTable.StreamArn
            StartingPosition: LATEST
            BatchSize: 1

  # Lambda: Handle PENDING events
  HandlerTransactionPendingEvents:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - src/handlerTransactionPendingEvents.ts
    Properties:
      Handler: handlerTransactionPendingEvents.handler
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource: !GetAtt TransactionsTable.Arn
      Events:
        SQSEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt TransactionPendingEventsQueue.Arn
            BatchSize: 1

  # Lambda: Handle PROCESSING events
  HandlerTransactionProcessingEvents:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - src/handlerTransactionProcessingEvents.ts
    Properties:
      Handler: handlerTransactionProcessingEvents.handler
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource: !GetAtt TransactionsTable.Arn
      Events:
        SQSEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt TransactionProcessingEventsQueue.Arn
            BatchSize: 1

Outputs:
  ApiBaseUrl:
    Description: Base URL of the API Gateway endpoint
    Value: !Sub "http://localhost:4566/restapis/${Api}/local/_user_request_"
